# Ablation: Stage 2 GP-path context window = 0 (noise-correlation GP, sample_gp_path).
# OWT counterpart to ablation_gpq0/lm1b_gpq0.yml -- same gp_q=0 degenerate
# target (eps_gp = noise identically, v_gp == v_lin, CorrNetwork's causal
# conv skipped -> pointwise-only block). Otherwise mirrors the main OWT
# Stage 2 recipe (corrflow_stage2-owt / configs/training_configs/sweep_owt_gp/
# timing_corrflow_steps64_n1000.yml): same backbone (public ELF-B-owt
# checkpoint), corr_model, batch size, blr.
#
# Unlike LM1B, do NOT enable gen_truncate_to_first_sentence here -- that fix
# is specific to LM1B's single-sentence/no-EOS backbone defect and actively
# hurts OWT (confirmed earlier this session: MAUVE 0.119 -> 0.016 when
# applied to OWT, since real OWT references are long documents truncated at
# a fixed token budget, not single sentences).

data_path: embedded-language-flows/openwebtext-t5
eval_data_path: null
max_length: 1024
pad_token: eos

encoder_model_name: t5-small
encoder_checkpoint: embedded-language-flows/t5_small_encoder_jax/t5_small_encoder_jax.pkl
latent_mean: 0.0
latent_std: 0.2

model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

backbone_checkpoint: /home.na1/ad.wsu.edu/khiem.tran/pvt/checkpoints/ELF-B-owt

gp_q: 0
gp_rho: 3.0
gp_kernel: content

corr_model: CorrNet-XL

denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: logit_normal

self_cond_prob: 0.5
label_drop_prob: 0.0

epochs: 50
max_steps: 8000
global_batch_size: 256
generation_batch_size: 64
blr: 0.0005
weight_decay: 0.0
warmup_steps: 500
warmup_epochs: -1
optimizer: muon

ema_decay1: 0.9999

sampling_configs_path: configs/sampling_configs/uncond_sampling_configs.yml
num_samples: 1000

online_eval: true
eval_ppl_model: gpt2-large
eval_ppl_batch_size: 32
eval_ppl_max_length: 1024

eval_mauve: true
eval_mauve_featurize_model: gpt2-large

log_freq: 100
save_freq: 1
eval_freq: 1

output_dir: "/scratch/khiem.tran@ad.wsu.edu/corrflow_baselines/outputs/ablation_gpq0/owt_gpq0"
hf_repo_id: null
resume: null

use_wandb: false
wandb_project: corrflow
wandb_entity: null
wandb_run_name: ablation_owt_gpq0

seed: 42
