# Ablation: FREEZE the pretrained LM1B Stage 1 backbone entirely and train
# ONLY LoRA low-rank adapters on top (train.py, NOT train_stage2.py; no GP
# path, no CorrNetwork). LM1B counterpart to ablation_lora/owt_lora.yml --
# same lora_rank=16 (~2.36M trainable params), same linear-OT objective,
# same 2k/4k/6k/8k step schedule.
#
# backbone_checkpoint points at THIS PROJECT'S OWN from-scratch LM1B Stage 1
# checkpoint (corrflow_stage1-lm1b/checkpoint_996904) -- there is no public
# pretrained "ELF-LM1B" checkpoint to fine-tune from (confirmed earlier this
# session: neither the embedded-language-flows HF org nor the original ELF
# GitHub repo has LM1B support). This backbone was trained on single-sentence
# LM1B data with no EOS target in its loss (see docs/lm1b_mauve_debug.md) --
# that limitation is inherited unchanged here, same as every other LM1B
# Stage 2 ablation this session; LoRA/full-fine-tune can only adapt WHAT the
# backbone already learned, not retroactively give it a stop signal it was
# never trained to predict.
#
# gen_truncate_to_first_sentence: true + eval_mauve: true mirror
# ablation_gpq0/lm1b_gpq0.yml's eval protocol for direct comparability
# across all LM1B ablations.

data_path: "/home.na1/ad.wsu.edu/khiem.tran/pvt/data/lm1b_train_t5"
eval_data_path: null
max_length: 128
pad_token: eos

encoder_model_name: t5-small
encoder_checkpoint: "embedded-language-flows/t5_small_encoder_jax/t5_small_encoder_jax.pkl"
latent_mean: 0.0
latent_std: 0.2

model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

backbone_checkpoint: "/home.na1/ad.wsu.edu/khiem.tran/pvt/CorrFlow/src/outputs/corrflow_stage1-lm1b/checkpoint_996904"
init_from_backbone_checkpoint: true

lora_rank: 16
lora_alpha: 16.0

denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"

decoder_prob: 0.2
decoder_noise_scale: 5.0
decoder_p_mean: 0.8
decoder_p_std: 0.8

self_cond_prob: 0.5

epochs: 50
max_steps: 8000
# LM1B's max_length=128 (vs OWT's 1024) makes full-backbone forward/backward
# far cheaper -- this is the SAME effective batch (128 x 4 = 512) the
# original from-scratch LM1B Stage 1 training used successfully, no
# OOM-driven reduction needed (unlike the OWT finetune/LoRA ablations).
global_batch_size: 128
grad_accum_steps: 4
generation_batch_size: 256
blr: 0.001
weight_decay: 0.0
warmup_steps: 500
warmup_epochs: -1
optimizer: muon

ema_decay1: 0.9999

sampling_configs_path: "configs/sampling_configs/uncond_sampling_configs.yml"
num_samples: 1000

online_eval: true
eval_ppl_model: "gpt2-large"
eval_ppl_batch_size: 32
eval_ppl_max_length: 128

eval_mauve: true
eval_mauve_featurize_model: "gpt2-large"
gen_truncate_to_first_sentence: true

log_freq: 100
save_freq: 1
eval_freq: 1

output_dir: "/scratch/khiem.tran@ad.wsu.edu/corrflow_baselines/outputs/ablation_lora/lm1b_lora"
hf_repo_id: null
resume: null

use_wandb: false
wandb_project: corrflow
wandb_entity: null
wandb_run_name: ablation_lm1b_lora

seed: 42
