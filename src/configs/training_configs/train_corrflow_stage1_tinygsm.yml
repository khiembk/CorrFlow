# Stage 1: Train the independent velocity field v_ind,θ on TinyGSM (conditional),
# evaluated on real GSM8K test problems by code execution.
# Follows the ELF training recipe (arXiv:2605.10938) -- ported from the
# original ELF repo's train_tinygsm_ELF-B.yml.
#
# Math reasoning rebuttal baseline: targets are short Python programs (TinyGSM,
# Liu et al.), scored by running each generated program and comparing its
# return value against the real GSM8K test answer -- an objective,
# execution-verified correctness signal, not a fluency proxy like PPL/MAUVE/
# BLEU. See utils/code_utils.py for the T5-vocab-safe escape/unescape codec
# (T5's tokenizer drops whitespace and several Python-syntax characters) and
# the execution harness (fresh subprocess per program, CPU/memory/wall-clock
# limited).
#
# Run:
#   cd src
#   python train.py --config configs/training_configs/train_corrflow_stage1_tinygsm.yml

# Dataset
data_path: "embedded-language-flows/tinygsm_train_t5"
eval_data_path: "embedded-language-flows/gsm8k_test_t5"
max_length: 512          # total sequence length: up to 192 input (problem) + target program tokens
max_input_length: 192    # problem statement length; remainder is the generated Python program
pad_token: eos
code_target: true        # targets are Python, escaped via utils/code_utils.py; score by execution, not BLEU/ROUGE
exec_num_proc: 16
exec_timeout: 10.0

# Encoder (frozen T5-small, same as ELF paper)
encoder_model_name: t5-small
encoder_checkpoint: "embedded-language-flows/t5_small_encoder_jax/t5_small_encoder_jax.pkl"
latent_mean: 0.0
latent_std: 0.2

# Model architecture (ELF-B, same as ELF paper default)
model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

# GP path (Stage 2 settings; define here so a future Stage 2 config can inherit)
gp_q: 2
gp_rho: 0.5
gp_kernel: rbf

# CorrNetwork (Stage 2 only)
corr_model: CorrNet-M

# Denoiser objective
denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"

# Decoder objective
decoder_prob: 0.2
decoder_noise_scale: 1.0
decoder_p_mean: 0.8
decoder_p_std: 0.8

# Conditioning / CFG
label_drop_prob: 0.1     # 10% unconditional for CFG training
self_cond_prob: 0.5

# Training
epochs: 11
global_batch_size: 512
blr: 0.001
weight_decay: 0.0
warmup_steps: 5000
warmup_epochs: -1         # warmup_steps takes precedence when >= 0
optimizer: muon

# EMA
ema_decay1: 0.9999

# Sampling (1,024-step ODE/SDE -- much longer generations than OWT/WMT14/XSum)
sampling_configs_path: "configs/sampling_configs/gsm_sampling_configs.yml"
num_samples: 1319         # full GSM8K test set

# Logging & Checkpointing
log_freq: 100
save_freq: 1
eval_freq: 1

# Output
output_dir: "outputs/corrflow_stage1-tinygsm"
hf_repo_id: null
resume: null

# Wandb
use_wandb: true
wandb_project: corrflow
wandb_entity: null
wandb_run_name: corrflow_stage1-tinygsm

# Misc
seed: 42
