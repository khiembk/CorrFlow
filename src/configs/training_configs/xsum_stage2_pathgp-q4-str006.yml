# Stage 2: XSum, path-correlation GP, q=4, strength=0.06, lengthscale=1.0 (best WMT14 setting)
# split_at=1024 applied automatically via max_input_length (source|summary boundary).

data_path: "/home.na1/ad.wsu.edu/khiem.tran/pvt/data/xsum_train_t5"
eval_data_path: "/home.na1/ad.wsu.edu/khiem.tran/pvt/data/xsum_validation_t5"
max_length: 1088
max_input_length: 1024
pad_token: eos

encoder_model_name: t5-small
encoder_checkpoint: "embedded-language-flows/t5_small_encoder_jax/t5_small_encoder_jax.pkl"
latent_mean: 0.0
latent_std: 0.2

model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

backbone_checkpoint: "/home.na1/ad.wsu.edu/khiem.tran/pvt/checkpoints/ELF-B-xsum"

# Path-correlation GP settings (best WMT14: gp_lengthscale=1.0)
use_path_gp: true
gp_q: 4
gp_path_strength: 0.06
gp_lengthscale: 1.0
gp_kernel: rbf
gp_obs_noise: 1.0
gp_jitter: 0.00001

corr_model: CorrNet-L

denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"

self_cond_prob: 0.5
label_drop_prob: 0.1

epochs: 5
global_batch_size: 256
generation_batch_size: 128
blr: 0.001
weight_decay: 0.0
warmup_steps: 500
warmup_epochs: -1
optimizer: muon

ema_decay1: 0.9999

sampling_configs_path: "configs/sampling_configs/cond_sampling_configs.yml"
num_samples: 1000

online_eval: true
eval_ppl_model: null

log_freq: 100
save_freq: 1
eval_freq: 1

output_dir: "outputs/xsum_stage2_pathgp-q4-str006"
hf_repo_id: null
resume: null

use_wandb: true
wandb_project: corrflow
wandb_entity: null
wandb_run_name: xsum_stage2_pathgp-q4-str006

seed: 42
