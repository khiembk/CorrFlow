# Ablation: Stage 2 context order = random, not causal/preceding.
# Instead of token i's context C_i = {i-gp_q, ..., i-1} (the gp_q tokens
# immediately preceding i in natural sequence order), both the GP-path
# target construction and the CorrNetwork's causal conv are applied to a
# per-sample random permutation of the sequence instead -- so C_i becomes a
# random gp_q-subset of the OTHER tokens, not a spatially local window. Same
# permutation reused for training's target+forward-pass consistency; a
# fixed-per-trajectory permutation at inference (see corr_context_order in
# configs/config.py and sample_random_order/make_corr_model_apply_fn in
# utils/sampling_utils.py). Uses the established best gp_q=4 (not gp_q=0 --
# this ablates WHICH tokens form the context, not whether a context exists
# at all) and otherwise mirrors the main OWT Stage 2 recipe (public
# ELF-B-owt backbone, same corr_model/batch size/blr).

data_path: embedded-language-flows/openwebtext-t5
eval_data_path: null
max_length: 1024
pad_token: eos

encoder_model_name: t5-small
encoder_checkpoint: embedded-language-flows/t5_small_encoder_jax/t5_small_encoder_jax.pkl
latent_mean: 0.0
latent_std: 0.2

model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

backbone_checkpoint: /home.na1/ad.wsu.edu/khiem.tran/pvt/checkpoints/ELF-B-owt

corr_context_order: random

gp_q: 4
gp_rho: 3.0
gp_kernel: content

corr_model: CorrNet-XL

denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: logit_normal

self_cond_prob: 0.5
label_drop_prob: 0.0

epochs: 50
max_steps: 8000
global_batch_size: 256
generation_batch_size: 64
blr: 0.0005
weight_decay: 0.0
warmup_steps: 500
warmup_epochs: -1
optimizer: muon

ema_decay1: 0.9999

sampling_configs_path: configs/sampling_configs/uncond_sampling_configs.yml
num_samples: 1000

online_eval: true
eval_ppl_model: gpt2-large
eval_ppl_batch_size: 32
eval_ppl_max_length: 1024

eval_mauve: true
eval_mauve_featurize_model: gpt2-large

log_freq: 100
save_freq: 1
eval_freq: 1

output_dir: "/scratch/khiem.tran@ad.wsu.edu/corrflow_baselines/outputs/ablation_random_order/owt_random_order"
hf_repo_id: null
resume: null

use_wandb: false
wandb_project: corrflow
wandb_entity: null
wandb_run_name: ablation_owt_random_order

seed: 42
