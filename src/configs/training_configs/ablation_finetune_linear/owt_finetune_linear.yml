# Ablation: directly fine-tune the PRETRAINED ELF-B-owt backbone with the
# plain Stage 1 linear-OT objective (train.py, NOT train_stage2.py) for
# 8000 steps on OWT -- no GP path, no CorrNetwork. Tests whether simply
# continuing to train the existing checkpoint on the same linear
# interpolation objective it was already trained with moves PPL/entropy/
# MAUVE at all, as a baseline the GP-path Stage 2 ablations can be read
# against.
#
# init_from_backbone_checkpoint: true makes train.py load ONLY the
# pretrained weights from backbone_checkpoint (via
# train_stage2.load_frozen_backbone, same loader Stage 2 uses -- handles
# both this repo's msgpack format and HF's orbax ocdbt format) and start
# the optimizer/step counter fresh at 0. This is NOT the same as `resume`,
# which would also carry over the checkpoint's own step count and make
# max_steps a no-op (ELF-B-owt was already trained far past 8000 steps).

data_path: "embedded-language-flows/openwebtext-t5"
max_length: 1024
pad_token: eos

encoder_model_name: t5-small
encoder_checkpoint: "embedded-language-flows/t5_small_encoder_jax/t5_small_encoder_jax.pkl"
latent_mean: 0.0
latent_std: 0.2

model: ELF-B
bottleneck_dim: 128
num_time_tokens: 4
num_self_cond_cfg_tokens: 4
num_model_mode_tokens: 4

backbone_checkpoint: /home.na1/ad.wsu.edu/khiem.tran/pvt/checkpoints/ELF-B-owt
init_from_backbone_checkpoint: true

denoiser_p_mean: -1.5
denoiser_p_std: 0.8
denoiser_noise_scale: 2.0
t_eps: 0.05
time_schedule: "logit_normal"

decoder_prob: 0.2
decoder_noise_scale: 5.0
decoder_p_mean: 0.8
decoder_p_std: 0.8

self_cond_prob: 0.5

epochs: 50
max_steps: 8000
# Single-GPU full-backbone fine-tuning (full gradients + Muon optimizer
# state over all 104M params, unlike Stage 2's ~2M-param CorrNetwork) OOMs
# at global_batch_size=256 or even 32 on one GPU (confirmed by smoke test:
# 256 -> wanted 707GiB, 32 -> wanted 88GiB). global_batch_size=8 +
# grad_accum_steps=4 (effective batch=32) is the smoke-tested-working point.
global_batch_size: 8
grad_accum_steps: 4
generation_batch_size: 64
blr: 0.001
weight_decay: 0.0
warmup_steps: 500
warmup_epochs: -1
optimizer: muon

ema_decay1: 0.9999

sampling_configs_path: "configs/sampling_configs/uncond_sampling_configs.yml"
num_samples: 1000

online_eval: true
eval_ppl_model: "gpt2-large"
eval_ppl_batch_size: 32
eval_ppl_max_length: 1024

eval_mauve: true
eval_mauve_featurize_model: "gpt2-large"
eval_mauve_max_length: 768

log_freq: 100
save_freq: 1
eval_freq: 1

output_dir: "/scratch/khiem.tran@ad.wsu.edu/corrflow_baselines/outputs/ablation_finetune_linear/owt_finetune_linear"
hf_repo_id: null
resume: null

use_wandb: false
wandb_project: corrflow
wandb_entity: null
wandb_run_name: ablation_owt_finetune_linear

seed: 42
